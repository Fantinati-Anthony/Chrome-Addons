<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toolkit - Sidebar</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="sidebar.css">
</head>
<body data-mode="sidebar">
  <div class="container sidebar-container">
    <header>
      <div class="header-top">
        <h1 id="popup-title">Toolkit</h1>
        <img id="popup-logo" src="" alt="Logo" style="display: none; height: 40px; max-width: 200px; object-fit: contain;">
        <div class="header-actions">
          <button id="btn-search-toggle" class="settings-btn" title="Rechercher">🔍</button>
          <button id="btn-switch-mode" class="settings-btn" title="Passer en mode Popup">📌</button>
          <button id="btn-reload" class="settings-btn" data-i18n-title="app.reload" title="Recharger l'extension">🔄</button>
          <button id="btn-settings" class="settings-btn" data-i18n-title="app.settings" title="Reglages">⚙️</button>
          <div id="update-badge" class="update-badge hidden" title="Mise a jour disponible">
            <span class="update-icon">&#8635;</span>
          </div>
        </div>
      </div>

      <!-- Search Bar (hidden by default, toggled by search icon) -->
      <div class="search-container hidden" id="header-search">
        <input type="text" id="search-tools" data-i18n-placeholder="app.searchPlaceholder" placeholder="Rechercher un outil...">
        <button id="btn-search-close" class="search-close-btn">✕</button>
      </div>

      <!-- Update notification banner (hidden by default) -->
      <div id="update-banner" class="update-banner hidden">
        <div class="update-info">
          <strong data-i18n="app.updateAvailable">Mise a jour disponible!</strong>
          <span id="update-versions"></span>
        </div>
        <div class="update-actions">
          <button id="btn-download-update" class="update-btn" data-i18n="app.download">Telecharger</button>
          <button id="btn-dismiss-update" class="update-btn-dismiss">X</button>
        </div>
      </div>
    </header>

    <!-- Main Content Wrapper -->
    <div id="main-content" class="main-content">
    <section id="grid-view" class="grid-view">
      <!-- Favorites Category (always visible, never collapsed) -->
      <div id="category-favorites" class="category-section favorites-section hidden">
        <div class="category-header favorites-header" data-collapsed="false" data-no-collapse="true">
          <span class="category-emoji">⭐</span>
          <span class="category-title" data-i18n="categories.favorites">Favoris</span>
          <span class="favorites-count">(0)</span>
        </div>
        <div class="tools-grid" id="favorites-container">
          <!-- Favorite tools loaded dynamically -->
        </div>
      </div>

      <!-- Custom Buttons Category -->
      <div id="category-customLinks" class="category-section">
        <div class="category-header" data-collapsed="true">
          <span class="category-emoji">🔗</span>
          <span class="category-title" data-i18n="categories.customLinks">Liens personnalises</span>
          <span class="category-toggle">▼</span>
        </div>
        <div class="tools-grid" id="custom-buttons-container">
          <!-- Custom buttons loaded dynamically -->
        </div>
      </div>

      <!-- Network & Remote Category -->
      <div id="category-network" class="category-section">

        <div class="tools-grid">

    <!-- Dynamic Tool Panel (loaded on demand) -->
    <section id="tool-panel" class="tool-panel hidden">
      <div class="panel-header">
        <button id="btn-back" class="back-btn">←</button>
        <h2 id="panel-title">Outil</h2>

      <div id="panel-content" class="panel-content">

      </div>

    </div><!-- End main-content -->

    <!-- Version Footer -->

    <!-- Add Tools Button (shown when no tools or to add more) -->
    <button id="btn-add-tools" class="add-tools-btn">
      <span class="add-icon">+</span>
      <span data-i18n="toolStore.addTools">Ajouter des outils</span>
    </button>

  <!-- Changelog Modal -->
  <div id="changelog-modal" class="changelog-modal-overlay">
    <div class="changelog-modal">
      <div class="changelog-header">
        <h3 id="changelog-title">
          <span class="tool-emoji" id="changelog-emoji"></span>
          <span id="changelog-name"></span>
        </h3>
        <button class="changelog-close-btn" id="btn-close-changelog">&times;</button>
      </div>
      <div class="changelog-body">
        <div class="changelog-description" id="changelog-description"></div>
        <div class="changelog-version-badge" id="changelog-current-version"></div>
        <ul class="changelog-list" id="changelog-list">
          <!-- Changelog entries loaded dynamically -->
        </ul>
      </div>
    </div>
  </div>

  <!-- Tool Templates (hidden, used for dynamic loading) -->
  <template id="tpl-colorpicker">
    <div class="tool-content">
      <button id="btn-pick-color" class="action-btn" data-i18n="colorpicker.pickColor">Choisir une couleur</button>
      <div id="color-list"></div>
      <div class="tool-actions">
        <button id="btn-clear-colors" class="small-btn" data-i18n="actions.clearAll">Tout effacer</button>
      </div>
    </div>

        <button id="btn-screenshot-visible" class="action-btn" data-i18n="screenshot.captureVisible">Zone visible</button>
        <button id="btn-screenshot-selection" class="action-btn" data-i18n="screenshot.captureSelection">Selection</button>
        <button id="btn-screenshot-element" class="action-btn" data-i18n="screenshot.captureElement">Element</button>
        <button id="btn-screenshot-fullpage" class="action-btn" data-i18n="screenshot.captureFullPage">Page complete</button>
        <button id="btn-screenshot-markdown" class="action-btn" data-i18n="screenshot.captureMarkdown">Markdown</button>
      </div>
      <div id="screenshot-status" class="status-message"></div>
      <div id="screenshot-preview" class="screenshot-preview"></div>
      <div id="markdown-output" class="markdown-output" style="display:none;">
        <textarea id="markdown-result" rows="10" readonly></textarea>
      </div>
      <div class="tool-actions">
        <button id="btn-download-screenshot" class="action-btn" data-i18n="screenshot.download">Telecharger</button>
        <button id="btn-copy-screenshot" class="small-btn" data-i18n="screenshot.copy">Copier</button>
        <button id="btn-copy-markdown" class="small-btn" style="display:none;" data-i18n="screenshot.copyMarkdown">Copier MD</button>
      </div>
    </div>
  </template>

  <template id="tpl-hashgen">
    <div class="tool-content">
      <textarea id="hash-input" placeholder="Texte a hasher..." rows="3"></textarea>
      <div class="tool-actions">
        <button id="btn-hash-md5" class="small-btn">MD5</button>
        <button id="btn-hash-sha1" class="small-btn">SHA-1</button>
        <button id="btn-hash-sha256" class="action-btn">SHA-256</button>
        <button id="btn-hash-sha512" class="small-btn">SHA-512</button>
      </div>
      <div id="hash-output" class="hash-result"></div>
      <button id="btn-copy-hash" class="small-btn" data-i18n="actions.copy">Copier</button>
    </div>
  </template>

  <template id="tpl-urlencoder">
    <div class="tool-content">
      <textarea id="url-input" placeholder="Texte ou URL a encoder/decoder..." rows="3"></textarea>
      <div class="tool-actions">
        <button id="btn-url-encode" class="action-btn" data-i18n="urlencoder.encode">Encoder</button>
        <button id="btn-url-decode" class="small-btn" data-i18n="urlencoder.decode">Decoder</button>
      </div>
      <div id="url-output" class="url-result"></div>
      <button id="btn-copy-url" class="small-btn" data-i18n="actions.copy">Copier</button>
    </div>
  </template>

  <template id="tpl-passwordgen">
    <div class="tool-content">
      <div class="password-options">
        <label><span data-i18n="passwordgen.length">Longueur</span>: <input type="number" id="pwd-length" value="16" min="4" max="128"></label>
        <label><input type="checkbox" id="pwd-upper" checked> A-Z</label>
        <label><input type="checkbox" id="pwd-lower" checked> a-z</label>
        <label><input type="checkbox" id="pwd-numbers" checked> 0-9</label>
        <label><input type="checkbox" id="pwd-symbols" checked> !@#$</label>
      </div>
      <button id="btn-generate-pwd" class="action-btn" data-i18n="passwordgen.generate">Generer</button>
      <div id="password-output" class="password-result"></div>
      <div class="password-strength" id="pwd-strength"></div>
      <button id="btn-copy-pwd" class="small-btn" data-i18n="actions.copy">Copier</button>
    </div>
  </template>

  <script src="modules/i18n.js"></script>
  <script src="modules/module-config.js"></script>
  <script src="modules/auto-updater.js"></script>
  <script src="modules/tool-store.js"></script>
  <script type="module" src="modules/panel-loader.js"></script>
  <script src="popup.js"></script>
</body>
</html>
